# element-skin Webhook 测试 Nginx 配置
# 适配域名后放入 /etc/nginx/sites-available/
#
# 场景 A（推荐，共用域名）：接收端挂在 element-skin 同域名的 /wh/ 前缀下
#   server_name union-test.gpa.ac.cn
#   /wh/ → 接收端 (127.0.0.1:8080)
#   其余  → element-skin 前端 + /skinapi 反代
#
# 场景 B（独立域名）：接收端用 hooks.your-domain.com，见文件底部注释块

# ---------- 场景 A：共用域名 ----------
server {
    listen 80;
    server_name union-test.gpa.ac.cn;

    # 接收端：/wh/ 前缀转发到 FastAPI
    location /wh/ {
        proxy_pass http://127.0.0.1:8080/wh/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 接收端需要原始 body 验签，关闭缓冲
        proxy_request_buffering off;
        proxy_read_timeout 15s;
    }

    # element-skin 前端根目录（docker compose 挂载的 ./frontend）
    root /opt/element-skin/frontend;
    index index.html;

    location / {
        add_header X-Authlib-Injector-API-Location "https://union-test.gpa.ac.cn/skinapi" always;
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 转发
    location /skinapi/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /skinapi {
        return 308 /skinapi/;
    }
}

