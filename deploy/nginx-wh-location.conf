# element-skin Webhook 接收端 Nginx 增量配置
# 适用：已有 element-skin Nginx 反代，只需在现有 server 块中增加 /wh/ 转发
#
# 用法：把下面的 location 块加入你现有的 server { ... } 中（server_name union-test.gpa.ac.cn 那个），
# 然后 nginx -t && systemctl reload nginx

    # Webhook 接收端：/wh/ 前缀转发到 FastAPI (127.0.0.1:8080)
    location /wh/ {
        proxy_pass http://127.0.0.1:8080/wh/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 接收端需要原始 body 验签，关闭缓冲
        proxy_request_buffering off;
        proxy_read_timeout 15s;
    }
